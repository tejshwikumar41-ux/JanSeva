databases:
  - name: janseva-db
    plan: free

services:
  - type: web
    name: janseva-bharat
    env: node
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma db push && npx tsx prisma/seed.ts && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: janseva-db
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
